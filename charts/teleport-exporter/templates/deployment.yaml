apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teleport-exporter.fullname" . }}
  labels:
    {{- include "teleport-exporter.labels" . | nindent 4 }}
  {{- with .Values.controller.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "teleport-exporter.selectorLabels" . | nindent 6 }}
  {{- with .Values.controller.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "teleport-exporter.selectorLabels" . | nindent 8 }}
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.tbot.enabled .Values.controller.podAnnotations }}
      annotations:
        {{- if .Values.tbot.enabled }}
        checksum/tbot-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "teleport-exporter.serviceAccountName" . }}
      # Neither container calls the Kubernetes API: tbot joins with the
      # dedicated projected token below, whose audience is the Teleport
      # cluster name.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.tbot.enabled }}
      initContainers:
        # Native sidecar: started before the exporter, kept running
        # alongside it, and the exporter only starts once tbot's startup
        # probe reports the first identity file written.
        - name: tbot
          image: "{{ .Values.tbot.image.repository }}:{{ .Values.tbot.image.tag }}"
          imagePullPolicy: {{ .Values.tbot.image.pullPolicy }}
          restartPolicy: Always
          args:
            - start
            - --config=/etc/tbot/tbot.yaml
          env:
            - name: KUBERNETES_TOKEN_PATH
              value: /var/run/secrets/tokens/join-sa-token
            {{- with .Values.tbot.extraEnv }}
            {{- include "teleport-exporter.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.controller.containerSecurityContext | nindent 12 }}
          ports:
            - name: diag
              containerPort: {{ .Values.tbot.diag.port }}
              protocol: TCP
          {{- if .Values.tbot.startupProbe.enabled }}
          startupProbe:
            {{- include "teleport-exporter.probe" .Values.tbot.startupProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.tbot.livenessProbe.enabled }}
          livenessProbe:
            {{- include "teleport-exporter.probe" .Values.tbot.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.tbot.readinessProbe.enabled }}
          readinessProbe:
            {{- include "teleport-exporter.probe" .Values.tbot.readinessProbe | nindent 12 }}
          {{- end }}
          {{- with .Values.tbot.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tbot-config
              mountPath: /etc/tbot
              readOnly: true
            - name: join-sa-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: identity
              mountPath: {{ include "teleport-exporter.identityDir" . }}
      {{- end }}
      containers:
        - name: teleport-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.controller.containerSecurityContext | nindent 12 }}
          {{- with (include "teleport-exporter.args" . | trim) }}
          args:
            {{- . | nindent 12 }}
          {{- end }}
          env:
            {{- include "teleport-exporter.env" . | trim | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- include "teleport-exporter.probe" .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- include "teleport-exporter.probe" .Values.readinessProbe | nindent 12 }}
          {{- end }}
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "teleport-exporter.volumeMounts" . | trim | nindent 12 }}
      volumes:
        {{- include "teleport-exporter.volumes" . | trim | nindent 8 }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
